version: '3.8'

services:
  uno-game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perinfoan-uno-game
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - uno-uploads:/app/uploads
    networks:
      - perinfoan-net

volumes:
  uno-uploads:

networks:
  perinfoan-net:
    external: true
