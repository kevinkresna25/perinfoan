version: '3.8'

services:
  uno-game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perinfoan-uno-game
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - perinfoan-net

networks:
  perinfoan-net:
    external: true
